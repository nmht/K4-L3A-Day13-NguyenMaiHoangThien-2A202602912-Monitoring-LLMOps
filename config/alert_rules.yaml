alerts:
  - name: HighErrorRate
    severity: Critical
    condition: error_rate_pct > 2
    duration: 5m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#high-error-rate
  - name: HighLatencyP95
    severity: Warning
    condition: latency_ms_p95 > 1000
    duration: 10m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#high-latency-p95
  - name: HighCostSpike
    severity: Critical
    condition: sum_cost_usd_1m > 1.0
    duration: 1m
    type: symptom-based
    channel: slack
    owner: devops-team
    runbook: docs/alerts.md#high-cost-spike
